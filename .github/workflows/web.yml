name: web

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/web.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_AI_API_URL: http://localhost:8000
      NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS: ogr.sakarya.edu.tr,sakarya.edu.tr
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
